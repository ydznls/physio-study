const sampleNote=`# 呼吸：先理解，再记住
这份试学讲义覆盖肺泡通气和化学感受性调节两个单元。其余第五章考点请结合大纲清单学习。
## 01 / 呼吸次数多，有效通气就多吗？
吸入空气要经过传导气道到达肺泡。留在传导气道、不参与肺泡与血液气体交换的空间称为解剖无效腔。因此，总气量与真正进入肺泡的新鲜气量需要分别计算。
**每分通气量 = 潮气量 × 呼吸频率**
**肺泡通气量 = (潮气量 − 无效腔气量) × 呼吸频率**
例如潮气量500 mL、无效腔150 mL、频率12次/min：总通气量6 L/min，肺泡通气量4.2 L/min。
若潮气量减半、频率加倍，总通气量仍为6 L/min，肺泡通气量却降至2.4 L/min。固定无效腔和总通气量时，每分钟无效腔通气越多，有效气量越少。
**别混淆：**肺通气与肺换气是不同环节。上述简化公式不能用于解释所有人工高频通气情境；也不能得出“越深越慢越好”。
来源：教材第10版正文 pp.145–146，PDF第168–169页，表5-1。
## 02 / 三种化学因素，三条清楚的路径
- **CO₂适度升高：**CO₂进入脑脊液及脑内局部细胞外液，使H⁺增加，刺激中枢化学感受器；同时存在外周途径。通常中枢途径起主要作用。
- **血液H⁺增加：**H⁺不易通过血-脑屏障，主要经外周化学感受器调节呼吸。必须与脑脊液H⁺区分。
- **动脉血PO₂下降：**呼吸兴奋反射通过外周化学感受器。氧含量与氧分压不能互相替代；严重低氧对中枢可有抑制作用。
**记忆抓手：**先判断刺激在哪里，再说感受器与路径，最后说效应和条件。
来源：教材第10版正文 pp.158–161，PDF第181–184页。
## 03 / 期中怎么学
先闭卷写出两条通气公式，再完成计算和感受器辨析题。每道题不仅选答案，还要说明其他选项错在哪里。学校大纲仅写机考，具体题型未给出。
## 04 / 期末怎么答
按“概念 → 刺激 → 感受器/关键环节 → 效应 → 条件”组织书面答案。期末卷面客观和主观各占50%，需要练习完整因果链。
学完肾章后，再联系肾参与pH调节与持续CO₂变化下的呼吸反应。这里是学习连接点，不是教师公布的必考综合题。
## 05 / 自测
- 总通气量相同，为什么浅快呼吸的有效气量通常较低？
- CO₂的中枢途径中，直接刺激是什么？
- 血液H⁺与脑脊液H⁺的调节途径有什么区别？
请在“练习与错题”中作答并核对解析。
## 覆盖边界
本样稿不包含通气阻力、胸内负压、表面活性物质、完整肺容量体系、换气影响因素、气体运输、氧解离曲线和其他大纲条目。上传教材后，可按章节生成补充讲义。`;

  if (data.attempts.some(a=>!a||typeof a.id!=='string'||typeof a.questionId!=='string'||!Number.isInteger(a.chapterId)||a.chapterId<1||a.chapterId>11||typeof a.correct!=='boolean')) throw new Error('备份中的练习记录无效。');

function renderMarkdown(text) {
  const lines = String(text).split('\n'); let html='',list=false;
  for (const raw of lines) {
    if (!/^[-*]\s/.test(raw) && list) {html+='</ul>';list=false;}
    let line=escapeHTML(raw).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');
    if (/^### /.test(raw)) html+=`<h3>${line.slice(4)}</h3>`;
    else if (/^## /.test(raw)) html+=`<h2>${line.slice(3)}</h2>`;
    else if (/^# /.test(raw)) html+=`<h2>${line.slice(2)}</h2>`;
    else if (/^[-*]\s/.test(raw)) {if(!list){html+='<ul>';list=true;}html+=`<li>${line.slice(2)}</li>`;}
    else if(line.trim()) html+=`<p>${line}</p>`;
  }
  return html+(list?'</ul>':'');
}

async function uploadFiles(files){if(uploadBusy)return;uploadBusy=true;render();let succeeded=0,errors=[];for(const file of files){try{const ext=file.name.split('.').at(-1).toLowerCase();if(!['pdf','doc','docx','txt','md'].includes(ext))throw new Error('不支持此文件格式');if(file.size>48*1024*1024)throw new Error('超过48 MB，请分章上传');let parsed;if(['txt','md'].includes(ext)){const text=await file.text();parsed={pages:Array.from({length:Math.ceil(text.length/12000)},(_,i)=>({page:i+1,text:text.slice(i*12000,(i+1)*12000)})),warning:''};}else{if(!backend.backend)throw new Error('PDF/Word解析需要本地服务；在线预览可先导入TXT或Markdown');const r=await fetch('./api/extract',{method:'POST',headers:{'Content-Type':'application/octet-stream','X-File-Extension':ext},body:file});parsed=await r.json();if(!r.ok)throw new Error(parsed.error||'文档解析失败');}if(!parsed.pages.some(p=>p.text.trim()))throw new Error('未提取到文字；扫描件需要OCR，当前版本不含OCR');const d={id:crypto.randomUUID(),name:file.name,ext,kind:ext==='pdf'?'pdf':'segment',role:/大纲|syllabus/i.test(file.name)?'syllabus':'textbook',edition:'',pages:parsed.pages,warning:parsed.warning||'',chars:parsed.pages.reduce((n,p)=>n+p.text.length,0),createdAt:new Date().toISOString()};await dbOp('documents','put',d);docs.push(d);succeeded++;}catch(err){errors.push(`${file.name}：${err.message}`);}}uploadBusy=false;render();toast(errors.length?errors.join('；'):`已导入${succeeded}份资料，下一步确认资料角色。`);}
async function generate(id){if(aiBusy)return;const c=getChapter(id);if(!c||!inScope(c,state.mode))return;const pages=selectSourcePages(docs,c);if(!pages.length){toast('请先上传能匹配本章的教材或课件。');return;}if(!generationReady()){pendingChapter={chapterId:c.id,mode:state.mode};toast('填写模型连接后，会继续生成本章。');location.hash='settings';return;}const existing=noteFor(c);if(existing&&!await confirmAction('重新生成这份讲义？','重新生成成功后将替换本章本考试模式下的讲义。可以先导出保留当前版本。'))return;
const mode=state.mode;const syllabus=docs.filter(d=>d.role==='syllabus').map(d=>d.pages.map(p=>p.text).join('\n')).join('\n');const messages=buildMessages(c,mode,pages,syllabus);aiBusy=true;aiJob={chapterId:c.id,mode};if(sameLesson(pendingChapter,c))pendingChapter=null;aiError='';aiErrorJob=null;render();try{const {baseUrl,model}=normalizeConnection(state.settings.baseUrl||backend.baseUrl,state.settings.model||backend.model,{local:backend.backend});if(!baseUrl||!model)throw new Error('请在设置中填写服务地址和模型名称。');let content;
if(backend.backend){const r=await fetch('./api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({apiKey,baseUrl,model,messages}),signal:AbortSignal.timeout(190000)});const x=await r.json();if(!r.ok)throw new Error(x.error||'生成失败');content=x.content;}
else{const r=await fetch(baseUrl+'/chat/completions',{method:'POST',redirect:'error',headers:{'Content-Type':'application/json',Authorization:`Bearer ${apiKey}`},body:JSON.stringify(modelRequest(baseUrl,model,messages)),signal:AbortSignal.timeout(180000)});const x=await r.json().catch(()=>null);if(!r.ok)throw new Error(modelError(r.status,x,apiKey));if(x?.choices?.[0]?.finish_reason==='length')throw new Error('本次输出达到长度上限，未保存不完整讲义，请缩小资料范围后重试。');content=x?.choices?.[0]?.message?.content;}
if(typeof content!=='string'||!content.trim())throw new Error('模型返回空内容。');const n={id:existing?.id||crypto.randomUUID(),chapterId:c.id,mode,origin:'ai',content,model,sources:pages.map(p=>({...p,kind:docs.find(d=>d.id===p.documentId)?.kind})),updatedAt:new Date().toISOString()};await dbOp('notes','put',n);notes=notes.filter(x=>x.id!==n.id).concat(n);toast('讲义已生成并保存，请核对来源与覆盖范围。');}
catch(err){aiErrorJob={chapterId:c.id,mode};aiError=err.name==='TimeoutError'?'模型响应超时，请稍后重试。':err.message==='Failed to fetch'?'连接失败：请检查服务地址、网络和跨域设置，或使用本地服务。':err.message;toast(aiError);}finally{aiBusy=false;aiJob=null;render();void startPendingChapter();}}

 try{

  connectionBusy=true;connectionStatus='正在验证密钥并读取可用模型…';render();let models;
  if(backend.backend){const r=await fetch('./api/test-connection',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({apiKey,baseUrl,model}),signal:AbortSignal.timeout(25000)});const data=await r.json();if(!r.ok)throw new Error(data.error||'测试连接失败。');models=data.models;}

  if(!models.includes(model))throw new Error(`密钥有效，但模型「${model}」不在可用列表中。可用模型：${models.slice(0,12).join('、')}`);
  connectionStatus=`连接成功：密钥有效，模型「${model}」可用。可以返回章节生成讲义。`;
 }catch(err){connectionStatus=err.name==='TimeoutError'?'连接超时，请检查网络后重试。':err.message==='Failed to fetch'?'浏览器无法连接服务。请检查网络和跨域设置；必要时使用本地服务。':err.message;}
 finally{connectionBusy=false;render();toast(connectionStatus);}
}
main.addEventListener('input',ev=>{if(ev.target.id==='course-search'){courseQuery=ev.target.value;document.querySelector('#course-grid').innerHTML=courseCards(scopedChapters(chapters,state.mode),courseQuery);}if(ev.target.dataset.written)writeDrafts[ev.target.dataset.written]=ev.target.value;});
main.addEventListener('change',async ev=>{const el=ev.target;try{if(el.dataset.progress){state.progress[el.dataset.progress]=el.value;save();toast('学习状态已保存。');render();}if(el.dataset.docRole||el.dataset.docEdition){const d=docs.find(x=>x.id===(el.dataset.docRole||el.dataset.docEdition));if(el.dataset.docRole)d.role=el.value;else d.edition=el.checked?'physiology-10':'';await dbOp('documents','put',d);render();}if(el.id==='upload-files')await uploadFiles([...el.files]);if(el.id==='import-backup'&&el.files[0]){const file=el.files[0];if(file.size>60*1024*1024)throw new Error('备份超过60 MB。');const x=validateBackup(JSON.parse(await file.text()));if(!await confirmAction('恢复这份备份？','将替换当前的资料、讲义与学习记录。建议先导出当前备份。'))return;await new Promise((resolve,reject)=>{const tx=db.transaction(['documents','notes'],'readwrite');tx.objectStore('documents').clear();tx.objectStore('notes').clear();x.documents.forEach(d=>tx.objectStore('documents').put(d));x.notes.forEach(n=>tx.objectStore('notes').put(n));tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});docs=x.documents;notes=x.notes;state.progress=x.progress;state.attempts=x.attempts;state.mode=x.mode==='final'?'final':'midterm';save();render();toast('备份已恢复。');}}catch(err){toast(err.message);}});
main.addEventListener('submit',ev=>{ev.preventDefault();const f=ev.target;if(f.id==='settings-form'){try{saveConnection();toast('连接设置已保存，密钥仅保留在本次会话。');if(pendingChapter){if(!generationReady()){toast('请填写 API Key。');return;}const target=`#chapter/${pendingChapter.chapterId}`;if(location.hash===target)enterRoute();else location.hash=target;}else render();}catch(err){toast(err.message);}return;}if(f.dataset.quiz){const q=questions.find(q=>q.id===f.dataset.quiz),answer=Number(new FormData(f).get('answer'));if(!Number.isInteger(answer)||answer<0||answer>=q.options.length)return;const correct=answer===q.answer;questionResults[q.id]={answer,correct};state.attempts.push({id:crypto.randomUUID(),questionId:q.id,chapterId:q.chapter,type:q.type,mode:state.mode,answer,correct,at:new Date().toISOString()});state.attempts=state.attempts.slice(-1000);if(!correct)state.progress[q.topicId]='learning';save();const y=scrollY;render();scrollTo(0,y);}if(f.dataset.writtenCheck){const q=questions.find(q=>q.id===f.dataset.writtenCheck),checked=new FormData(f).getAll('criteria').length;questionResults[q.id]={revealed:true,checked};state.attempts.push({id:crypto.randomUUID(),questionId:q.id,chapterId:q.chapter,type:'written',mode:state.mode,answer:writeDrafts[q.id]||'',checked,total:q.criteria.length,correct:checked===q.criteria.length,selfChecked:true,at:new Date().toISOString()});if(checked<q.criteria.length)state.progress[q.topicId]='learning';save();toast('自查已记录；这不是自动评分。');}});
main.addEventListener('click',async ev=>{const tab=ev.target.closest('[data-tab]');if(tab){activeTab=tab.dataset.tab;editNoteId=null;render();return;}const filter=ev.target.closest('[data-filter]');if(filter){questionFilter=filter.dataset.filter;render();return;}const b=ev.target.closest('[data-action]');if(!b)return;const id=b.dataset.id,c=getChapter(b.dataset.chapter);try{switch(b.dataset.action){
case 'preset-deepseek':document.querySelector('#base-url').value='https://api.deepseek.com';document.querySelector('#model-name').value='deepseek-flash';connectionStatus='';toast('已填入 DeepSeek 官方地址与模型名，请保存或测试连接。');break;
case 'test-connection':await testConnection();break;
case 'switch-final':setMode('final');break;
case 'setup-ai':pendingChapter={chapterId:c.id,mode:state.mode};location.hash='settings';break;
case 'generate':await generate(c.id);break;
case 'download-note':{const n=noteFor(c);download(`生理学-${c.name}-${state.mode==='midterm'?'期中':'期末'}.md`,n?.content||sampleNote);break;}
case 'edit-note':{if(aiBusy){toast('请等待讲义生成完成后再编辑。');break;}let n=noteFor(c);if(!n){n={id:crypto.randomUUID(),chapterId:c.id,mode:state.mode,origin:'manual',content:sampleNote,updatedAt:new Date().toISOString(),sources:[]};await dbOp('notes','put',n);notes.push(n);}editNoteId=n.id;render();break;}
case 'save-note':{const n=noteFor(c);n.content=document.querySelector('#note-editor').value;n.updatedAt=new Date().toISOString();await dbOp('notes','put',n);editNoteId=null;render();toast('讲义修改已保存。');break;}
case 'preview-file':viewSourceId=viewSourceId===id?null:id;render();break;
case 'delete-file':if(await confirmAction('删除这份资料？','删除浏览器中的提取文本；已生成讲义及其引用快照会保留。')){await dbOp('documents','delete',id);docs=docs.filter(d=>d.id!==id);render();}break;
case 'show-reference':questionResults[id]={...questionResults[id],revealed:true};document.querySelector(`#reference-${id}`).hidden=false;break;
case 'backup':await backup();break;
case 'clear-key':apiKey='';connectionStatus='';render();toast('已清除本次会话的密钥。');break;
case 'reset-progress':if(await confirmAction('重置学习记录？','将清空知识点状态和练习记录，保留上传资料与讲义。')){state.progress={};state.attempts=[];questionResults={};save();render();toast('学习记录已重置。');}break;
}}catch(err){toast(err.message);}});
function setMode(mode){if(editNoteId){toast('请先保存讲义编辑，再切换考试方案。');return;}state.mode=mode;save();const [route,id]=location.hash.slice(1).split('/');if((route==='chapter'||route==='practice')&&id&&!inScope({id:Number(id)},mode))location.hash='courses';else if(route==='chapter')enterRoute();else {pendingChapter=null;render();}}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
document.querySelector('#theme-toggle').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';save();render();};document.querySelector('#backup-side').onclick=backup;
addEventListener('hashchange',()=>{enterRoute();scrollTo(0,0);});
addEventListener('beforeunload',ev=>{if(editNoteId||aiBusy){ev.preventDefault();ev.returnValue='';}});
try{db=await openDB();[docs,notes]=await Promise.all([dbOp('documents','getAll'),dbOp('notes','getAll')]);}catch(err){main.innerHTML='<div class="error-banner">浏览器本地数据库不可用，请退出隐私模式或启用网站存储后重新打开。</div>';throw err;}
enterRoute();
window.__physio={getState:()=>({mode:state.mode,documents:docs.length,notes:notes.length,progress:state.progress,attempts:state.attempts}),backend};
</script>
</body>
</html>
